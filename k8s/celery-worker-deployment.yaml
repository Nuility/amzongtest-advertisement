apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: amazon-ads
  labels:
    app: amazon-ads
    component: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amazon-ads
      component: celery-worker
  template:
    metadata:
      labels:
        app: amazon-ads
        component: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: registry.cn-hangzhou.aliyuncs.com/amazon-ads/backend:v1.0.0
        imagePullPolicy: Always
        command: ["celery", "-A", "app.jobs.celery_app", "worker"]
        args: ["--loglevel=info", "--concurrency=4", "--queues=default,ads_sync,bidding"]
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        env:
        - name: C_FORCE_ROOT
          value: "true"
        - name: WORKER_TYPE
          value: "worker"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "celery -A app.jobs.celery_app inspect ping -d celery@$HOSTNAME"
          initialDelaySeconds: 60
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
