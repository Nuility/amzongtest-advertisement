apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: amazon-ads-network-policy
  namespace: amazon-ads
  labels:
    app: amazon-ads
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-network-policy
  namespace: amazon-ads
spec:
  podSelector:
    matchLabels:
      component: backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: amazon-ads
      podSelector:
        matchLabels:
          component: frontend
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: amazon-ads
      podSelector:
        matchLabels:
          component: celery-worker
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: amazon-ads
      podSelector:
        matchLabels:
          component: celery-beat
    ports:
    - port: 8000
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: amazon-ads
      podSelector:
        matchLabels:
          component: mysql
    ports:
    - port: 3306
      protocol: TCP
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: amazon-ads
      podSelector:
        matchLabels:
          component: redis
    ports:
    - port: 6379
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - port: 443
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-network-policy
  namespace: amazon-ads
spec:
  podSelector:
    matchLabels:
      component: frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from: []
    ports:
    - port: 80
      protocol: TCP
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: amazon-ads
      podSelector:
        matchLabels:
          component: backend
    ports:
    - port: 8000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: celery-network-policy
  namespace: amazon-ads
spec:
  podSelector:
    matchLabels:
      app: amazon-ads
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: amazon-ads
    ports: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: amazon-ads
    ports: []
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - port: 443
      protocol: TCP
