apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: amazon-ads
  labels:
    app: amazon-ads
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amazon-ads
      component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: amazon-ads
        component: frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: amazon-ads
                  component: frontend
              topologyKey: kubernetes.io/hostname
      containers:
      - name: frontend
        image: registry.cn-hangzhou.aliyuncs.com/amazon-ads/frontend:v1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        env:
        - name: API_BASE_URL
          value: "https://api.yourdomain.com"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: amazon-ads
  labels:
    app: amazon-ads
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: amazon-ads
    component: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
