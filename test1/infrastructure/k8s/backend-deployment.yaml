apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: amazon-ads
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amazon-ads
      component: backend
  template:
    metadata:
      labels:
        app: amazon-ads
        component: backend
    spec:
      containers:
      - name: backend
        image: swr.cn-north-4.myhuaweicloud.com/amazon-ads/backend:v1.0
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: url
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: amazon-ads
    component: backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
