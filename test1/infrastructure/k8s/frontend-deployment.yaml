apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: amazon-ads
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: amazon-ads
      component: frontend
  template:
    metadata:
      labels:
        app: amazon-ads
        component: frontend
    spec:
      containers:
      - name: frontend
        image: swr.cn-north-4.myhuaweicloud.com/amazon-ads/frontend:v1.0
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: amazon-ads
    component: frontend
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer
