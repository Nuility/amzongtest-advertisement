[tool:pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    --timeout=10
markers =
    unit: Unit tests
    integration: Integration tests
    api: API tests
    slow: Slow running tests

[tool:coverage:run]
source = app
omit = 
    */tests/*
    */migrations/*
    */__pycache__/*
    */site-packages/*

[tool:coverage:report]
precision = 2
show_missing = True
skip_covered = False

[tool:black]
line-length = 100
target-version = ['py310']

[tool:isort]
profile = black
line_length = 100
